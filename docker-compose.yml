services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-scheduler} -d $${POSTGRES_DB:-scheduler}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    ports:
      - "${DASHBOARD_PORT:-18888}:18888"
    environment:
      # Local demo only: anyone who can reach the port can read the telemetry.
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    environment:
      ConnectionStrings__Scheduler: Host=postgres;Port=5432;Database=${POSTGRES_DB:-scheduler};Username=${POSTGRES_USER:-scheduler};Password=${POSTGRES_PASSWORD:-scheduler}
      Database__MigrateOnStartup: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: scheduler-api
      Logging__Console__FormatterName: json

volumes:
  postgres-data:
